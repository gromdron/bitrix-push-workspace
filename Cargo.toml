[package]
name = "bitrix-push-workspace"
version = "2.0.0"
edition = "2024"

[dependencies]
sha1 = "0.10.5"
hmac = "0.12.1"
axum = { version = "0.7", features = ["ws", "macros", "http2", "original-uri"] }
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.0"
thiserror = "1.0"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"
log = "0.4"
fern = { version = "0.7" }
config = { version = "0.15", default-features = false, features = ["toml"] }
prost = "0.13"
hex = "0.4"

[build-dependencies]
prost-build = "0.13"